<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC/USDT.D Ratio + BTC Price</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #131722;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chart-panel {
            width: 100%;
            flex: 1;
            position: relative;
        }
        .chart-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .divider {
            width: 100%;
            height: 2px;
            background: #2a2e39;
        }
    </style>
</head>
<body>
    <!-- 상단: BTC 가격 차트 -->
    <div class="chart-panel">
        <iframe 
            src="https://www.tradingview.com/widgetembed/?hideideas=1&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=kr&symbol=BINANCE%3ABTCUSDT&interval=W&theme=dark&style=1&timezone=Asia%2FSeoul&withdateranges=1&allow_symbol_change=0&save_image=1&details=1&calendar=0&hide_volume=1&overrides=%7B%22mainSeriesProperties.priceAxisProperties.log%22%3Atrue%7D"
            allowtransparency="true" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="divider"></div>

    <!-- 하단: BTC/USDT.D 비율 차트 -->
    <div class="chart-panel">
        <iframe 
            src="https://www.tradingview.com/widgetembed/?hideideas=1&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=kr&symbol=BINANCE%3ABTCUSDT%2FCRYPTOCAP%3AUSDT.D&interval=W&theme=dark&style=1&timezone=Asia%2FSeoul&withdateranges=1&allow_symbol_change=0&save_image=1&details=1&calendar=0&hide_volume=1&overrides=%7B%22mainSeriesProperties.priceAxisProperties.log%22%3Atrue%7D"
            allowtransparency="true" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
