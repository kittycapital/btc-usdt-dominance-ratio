<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC/USDT.D Ratio + BTC Price</title>
    <meta property="og:title" content="BTC / USDT 도미넌스 비율 | HerdVibe">
    <meta property="og:description" content="BTC 가격과 USDT 도미넌스 비율로 고점·저점 확인">
    <meta property="og:url" content="https://herdvibe.com/104">
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #131722;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chart-panel {
            width: 100%;
            flex: 1;
            position: relative;
        }
        .chart-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .divider {
            width: 100%;
            height: 2px;
            background: #2a2e39;
        }
        /* Share Bar */
        .share-bar {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            padding: 10px 16px; background: #0a0a0a; flex-shrink: 0; flex-wrap: wrap;
        }
        .share-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
            background: transparent; color: #888; font-size: .72rem;
            font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: all 0.2s;
        }
        .share-btn:hover { background: #1a1a1a; }
        .share-btn svg { width: 14px; height: 14px; }
        .share-btn.twitter:hover { border-color: #1da1f2; color: #1da1f2; }
        .share-btn.kakao:hover { border-color: #fee500; color: #fee500; }
        .share-btn.telegram:hover { border-color: #26a5e4; color: #26a5e4; }
        .share-btn.instagram:hover { border-color: #E4405F; color: #E4405F; }
        .share-btn.link:hover { border-color: #00d4aa; color: #00d4aa; }
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; color: #e5e5e5; padding: 10px 18px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,.12); border-left: 3px solid #00d4aa;
            font-size: .78rem; font-weight: 500; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,.7);
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <!-- 상단: BTC 가격 차트 -->
    <div class="chart-panel">
        <iframe 
            src="https://www.tradingview.com/widgetembed/?hideideas=1&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=kr&symbol=BINANCE%3ABTCUSDT&interval=W&theme=dark&style=1&timezone=Asia%2FSeoul&withdateranges=1&allow_symbol_change=0&save_image=1&details=1&calendar=0&hide_volume=1&overrides=%7B%22mainSeriesProperties.priceAxisProperties.log%22%3Atrue%7D"
            allowtransparency="true" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="divider"></div>

    <!-- 하단: BTC/USDT.D 비율 차트 -->
    <div class="chart-panel">
        <iframe 
            src="https://www.tradingview.com/widgetembed/?hideideas=1&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=kr&symbol=BINANCE%3ABTCUSDT%2FCRYPTOCAP%3AUSDT.D&interval=W&theme=dark&style=1&timezone=Asia%2FSeoul&withdateranges=1&allow_symbol_change=0&save_image=1&details=1&calendar=0&hide_volume=1&overrides=%7B%22mainSeriesProperties.priceAxisProperties.log%22%3Atrue%7D"
            allowtransparency="true" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- Share Bar -->
    <div class="share-bar">
        <button class="share-btn twitter" onclick="shareTwitter()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            트위터
        </button>
        <button class="share-btn kakao" onclick="shareKakao()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.463 2 10.691c0 2.724 1.8 5.116 4.508 6.482-.144.525-.925 3.388-.958 3.603 0 0-.02.157.083.217.103.06.224.013.224.013.296-.041 3.434-2.263 3.973-2.652.703.098 1.428.15 2.17.15 5.523 0 10-3.463 10-7.813C22 6.463 17.523 3 12 3z"/></svg>
            카카오톡
        </button>
        <button class="share-btn telegram" onclick="shareTelegram()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            텔레그램
        </button>
        <button class="share-btn instagram" onclick="shareInstagram()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            인스타그램
        </button>
        <button class="share-btn link" onclick="copyLink()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            링크복사
        </button>
    </div>
    <div class="toast" id="toast">링크가 복사되었습니다!</div>

    <script>
        const SHARE_URL = 'https://herdvibe.com/104';
        const SHARE_TITLE = 'BTC / USDT 도미넌스 비율 | HerdVibe';
        const SHARE_DESC = 'BTC 가격과 USDT 도미넌스 비율로 고점·저점 확인';

        try { Kakao.init('a43ed7b39fac35458f4f9df925a279b5'); } catch(e) {}

        function shareTwitter() {
            window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(SHARE_TITLE + '\n' + SHARE_DESC) + '&url=' + encodeURIComponent(SHARE_URL), '_blank');
        }
        function shareKakao() {
            if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
                Kakao.Share.sendDefault({
                    objectType: 'feed',
                    content: { title: SHARE_TITLE, description: SHARE_DESC, imageUrl: '', link: { mobileWebUrl: SHARE_URL, webUrl: SHARE_URL } },
                    buttons: [{ title: '차트 보기', link: { mobileWebUrl: SHARE_URL, webUrl: SHARE_URL } }]
                });
            }
        }
        function shareTelegram() {
            window.open('https://t.me/share/url?url=' + encodeURIComponent(SHARE_URL) + '&text=' + encodeURIComponent(SHARE_TITLE), '_blank');
        }
        function shareInstagram() { doCopy(); }
        function copyLink() { doCopy(); }
        function doCopy() {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'clipboard', text: SHARE_URL }, '*');
                showToast();
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(SHARE_URL).then(showToast).catch(fallbackCopy);
            } else { fallbackCopy(); }
        }
        function fallbackCopy() {
            var t = document.createElement('textarea');
            t.value = SHARE_URL; t.style.position = 'fixed'; t.style.opacity = '0';
            document.body.appendChild(t); t.select();
            try { document.execCommand('copy'); showToast(); } catch(e) {}
            document.body.removeChild(t);
        }
        function showToast() {
            var el = document.getElementById('toast');
            el.classList.add('show');
            setTimeout(function() { el.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
